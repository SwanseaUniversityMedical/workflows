name: 'DotNet Test'
description: "Restores and runs the tests for a dotnet solution or project."
inputs:

  project-file:
    description: "Path to the sln or csproj file to test, relative to project-context."
    required: true

  project-context:
    description: "Path to the root dir of the project."
    default: '.'

  configuration:
    description: "Build configuration to test."
    default: 'Release'

  dotnet-image:
    description: "Docker image with the dotnet SDK used to restore and test."
    default: 'harbor.ukserp.ac.uk/github-workflows/sonar-dotnet-10:1.0.1'

  nuget-config:
    description: "NuGet configuration content to inject into the build."
    default: ''

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: prepare build context with NuGet config
      id: prepare-build-context
      shell: bash
      run: |
        if [ -z "$NUGET_CONFIG" ]; then
          echo "build-context=." >> $GITHUB_OUTPUT
        else
          BUILD_CONTEXT="$RUNNER_TEMP/dotnet-test-build-context"
          mkdir -p "$BUILD_CONTEXT"
          cp -r . "$BUILD_CONTEXT/repo"
          echo "$NUGET_CONFIG" > "$BUILD_CONTEXT/repo/NuGet.Config"
          echo "$NUGET_CONFIG" > "$BUILD_CONTEXT/repo/nuget.config"
          echo "build-context=$BUILD_CONTEXT/repo" >> $GITHUB_OUTPUT
        fi
      env:
        NUGET_CONFIG: ${{ inputs.nuget-config }}

    - name: restore and test
      shell: bash
      run: |
        docker run --rm \
          -v "$BUILD_CONTEXT":/repo \
          -v /var/run/docker.sock:/var/run/docker.sock \
          -w "/repo/$PROJECT_CONTEXT" \
          "$DOTNET_IMAGE" \
          bash -c " \
            dotnet restore \"$PROJECT_FILE\" && \
            dotnet test \"$PROJECT_FILE\" -c \"$CONFIGURATION\" \
              --logger \"trx;LogFileName=test-results.trx\" \
              --results-directory /repo/TestResults"
      env:
        BUILD_CONTEXT: ${{ steps.prepare-build-context.outputs.build-context }}
        DOTNET_IMAGE: ${{ inputs.dotnet-image }}
        PROJECT_FILE: ${{ inputs.project-file }}
        PROJECT_CONTEXT: ${{ inputs.project-context }}
        CONFIGURATION: ${{ inputs.configuration }}
