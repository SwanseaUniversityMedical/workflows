name: 'PR and Release Keycloakify'
inputs:
  name:
    description: "Name of the release asset."
    required: true

  working-directory:
    description: "Directory containing the Keycloakify package.json."
    default: "."

  node-version:
    description: "Node version used to build the theme."
    default: "24"

  java-version:
    description: "Java version used by the Keycloakify jar build."
    default: "21"

  test-script:
    description: "Name of an npm script to run before the build. Empty skips it."
    default: ""

  build-command:
    description: "Command that builds the theme jar."
    default: "npm run build-keycloak-theme"

  jar-glob:
    description: "Glob, relative to the working directory, matching the built jar."
    default: "dist_keycloak/**/*.jar"

  comment-pr:
    description: "PR build comment creation and update."
    default: "true"

  comment-release:
    description: "Release comment creation and update."
    default: "true"

  release-tag-format:
    description: "Semantic-release Github release tag format."
    default: '${version}'

  base-image:
    description: "Base image the jar is copied into."
    default: "busybox:1.37"

  registry:
    description: "URL of the container registry."
    required: true

  registry-user:
    description: "Username for the container registry."
    required: true

  registry-repo:
    description: "Repo within container registry project."
    required: true

  registry-token:
    description: "Authentication token for the container registry."
    required: true

  notation-cert:
    description: "Public key for notation signing images."
    required: true

  notation-key:
    description: "Private key for notation signing images."
    required: false

  platforms:
    description: "Comma-separated list of platforms to build for (e.g., linux/amd64,linux/arm64)"
    default: "linux/amd64"

  registry-extra-tag-command:
    description: "Extra tag to push release container."
    default: ""

outputs:
  release-info:
    description: "All release info in one json blob."
    value: ${{ steps.release.outputs.release-info }}

  new-release-published:
    description: "Semantic release output."
    value: ${{ steps.release.outputs.new-release-published }}

  release-version:
    description: "Semantic release output."
    value: ${{ steps.release.outputs.release-version }}

  git-tag:
    description: "Semantic release output."
    value: ${{ steps.release.outputs.git-tag }}

  pr-number:
    description: "Release PR number."
    value: ${{ steps.release.outputs.pr-number }}

  jar-path:
    description: "Path to the built jar."
    value: ${{ steps.pr.outputs.jar-path }}

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - id: create-release-labels
      uses: SwanseaUniversityMedical/workflows/.github/actions/create-release-labels@v3.0.1-create-release-labels-action
      with:
        name: ${{ inputs.name }}

    - name: add eligible label
      if: github.event_name == 'pull_request'
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      with:
        script: |
          var inputs = ${{ toJSON(inputs) }};
          var asset = inputs['name'];
          var eligible = `eligible: ${asset}`;

          try {
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ github.event.pull_request.number }},
              labels: [eligible]
            });
          } catch (error) {
            console.log(error);
          }

    - id: pr
      if: github.event_name == 'pull_request'
      uses: SwanseaUniversityMedical/workflows/.github/actions/pr-keycloakify@v1.0.0-pr-keycloakify-action
      with:
        name: ${{ inputs.name }}
        working-directory: ${{ inputs.working-directory }}
        node-version: ${{ inputs.node-version }}
        java-version: ${{ inputs.java-version }}
        test-script: ${{ inputs.test-script }}
        build-command: ${{ inputs.build-command }}
        jar-glob: ${{ inputs.jar-glob }}
        base-image: ${{ inputs.base-image }}
        comment-enabled: ${{ inputs.comment-pr }}
        registry: ${{ inputs.registry }}
        registry-user: ${{ inputs.registry-user }}
        registry-repo: ${{ inputs.registry-repo }}
        registry-token: ${{ inputs.registry-token }}
        platforms: ${{ inputs.platforms }}
        notation-cert: ${{ inputs.notation-cert }}
        notation-key: ${{ inputs.notation-key }}

    - id: release
      if: github.event_name == 'push'
      uses: SwanseaUniversityMedical/workflows/.github/actions/release-keycloakify@v1.0.0-release-keycloakify-action
      with:
        name: ${{ inputs.name }}
        working-directory: ${{ inputs.working-directory }}
        node-version: ${{ inputs.node-version }}
        java-version: ${{ inputs.java-version }}
        test-script: ${{ inputs.test-script }}
        build-command: ${{ inputs.build-command }}
        jar-glob: ${{ inputs.jar-glob }}
        base-image: ${{ inputs.base-image }}
        comment-enabled: ${{ inputs.comment-release }}
        release-tag-format: ${{ inputs.release-tag-format }}
        registry: ${{ inputs.registry }}
        registry-user: ${{ inputs.registry-user }}
        registry-repo: ${{ inputs.registry-repo }}
        registry-token: ${{ inputs.registry-token }}
        registry-extra-tag-command: ${{ inputs.registry-extra-tag-command }}
        platforms: ${{ inputs.platforms }}
        notation-cert: ${{ inputs.notation-cert }}
        notation-key: ${{ inputs.notation-key }}
