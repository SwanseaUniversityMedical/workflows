name: 'Release Keycloakify'
inputs:
  name:
    description: "Name of the release asset."
    required: true

  working-directory:
    description: "Directory containing the Keycloakify package.json."
    default: "."

  node-version:
    description: "Node version used to build the theme."
    default: "24"

  java-version:
    description: "Java version used by the Keycloakify jar build."
    default: "21"

  test-script:
    description: "Name of an npm script to run before the build. Empty skips it."
    default: ""

  build-command:
    description: "Command that builds the theme jar."
    default: "npx keycloakify build"

  jar-glob:
    description: "Glob, relative to the working directory, matching the built jar."
    default: "dist_keycloak/**/*.jar"

  comment-header:
    description: "Header line for the Release summary."
    default: ":rocket: :art: Build Release Keycloakify"

  comment-enabled:
    description: "Release comment creation and update."
    default: "true"

  release-tag-format:
    description: "Semantic-release Github release tag format."
    default: '${version}'

outputs:
  release-info:
    description: "All release info in one json blob."
    value: ${{ toJSON(steps.semantic.outputs) }}

  new-release-published:
    description: "Semantic release output."
    value: ${{ steps.semantic.outputs.new-release-published }}

  release-version:
    description: "Semantic release output."
    value: ${{ steps.semantic.outputs.release-version }}

  git-tag:
    description: "Semantic release output."
    value: ${{ steps.semantic.outputs.git-tag }}

  pr-number:
    description: "Release PR number."
    value: ${{ steps.semantic.outputs.pr-number }}

  jar-path:
    description: "Path to the released jar."
    value: ${{ steps.build.outputs.jar-path }}

runs:
  using: "composite"
  steps:
    - name: determine release
      id: semantic
      uses: SwanseaUniversityMedical/workflows/.github/actions/determine-bump@v2.0.3-determine-bump-action
      with:
        name: ${{ inputs.name }}
        release-tag-format: ${{ inputs.release-tag-format }}

    - name: skipped release
      if: steps.semantic.outputs.new-release-published != 'true'
      shell: bash
      run: |
        echo "${SUMMARY}" >> "$GITHUB_STEP_SUMMARY"
      env:
        SUMMARY: |
          #### ${{ inputs.comment-header }} - ${{ inputs.name }} - :label: Commit: ${{ github.sha }}
          :desert_island: Skipping release!

    - name: add skipped label
      if: steps.semantic.outputs.new-release-published != 'true'
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      with:
        script: |
          var inputs = ${{ toJSON(inputs) }};
          var asset = inputs['name'];
          var skipped = `skipped: ${asset}`;

          try {
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.semantic.outputs.pr-number }},
              labels: [skipped]
            });
          } catch (error) {
            console.log(error);
          }

    - name: new release
      if: steps.semantic.outputs.new-release-published == 'true'
      shell: bash
      run: |
        echo "${SUMMARY}" >> "$GITHUB_STEP_SUMMARY"
      env:
        SUMMARY: |
          #### ${{ inputs.comment-header }} - ${{ inputs.name }} - :label: Commit: ${{ github.sha }}
          :label: New version will be ${{ steps.semantic.outputs.release-version }}

    - name: build
      id: build
      if: steps.semantic.outputs.new-release-published == 'true'
      uses: SwanseaUniversityMedical/workflows/.github/actions/build-keycloakify@test/keycloakify
      with:
        working-directory: ${{ inputs.working-directory }}
        node-version: ${{ inputs.node-version }}
        java-version: ${{ inputs.java-version }}
        test-script: ${{ inputs.test-script }}
        build-command: ${{ inputs.build-command }}
        jar-glob: ${{ inputs.jar-glob }}

    - name: github release
      if: steps.semantic.outputs.new-release-published == 'true'
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      id: release
      with:
        retries: 3
        github-token: ${{ github.token }}
        script: |
          await github.rest.repos.createRelease({
            owner: "${{ github.repository_owner }}",
            repo: "${{ github.event.repository.name }}",
            tag_name: "${{ steps.semantic.outputs.git-tag }}",
            target_commitish: "${{ github.sha }}",
            body: "",
            name: "${{ steps.semantic.outputs.git-tag }}"
          });

    - name: upload jar to release
      id: upload
      if: steps.release.outcome == 'success'
      shell: bash
      run: |
        asset="${RUNNER_TEMP}/${NAME}-${VERSION}.jar"
        cp "$JAR_PATH" "$asset"
        gh release upload "$TAG" "$asset" --repo "$REPOSITORY" --clobber
      env:
        GH_TOKEN: ${{ github.token }}
        NAME: ${{ inputs.name }}
        VERSION: ${{ steps.semantic.outputs.release-version }}
        TAG: ${{ steps.semantic.outputs.git-tag }}
        JAR_PATH: ${{ steps.build.outputs.jar-path }}
        REPOSITORY: ${{ github.repository }}

    - name: release success
      if: steps.upload.outcome == 'success'
      shell: bash
      run: |
        echo "${SUMMARY}" >> "$GITHUB_STEP_SUMMARY"
      env:
        SUMMARY: |
          ```
          ${{ steps.semantic.outputs.git-tag }}
          ```
          :hammer_and_wrench: Github Release Success

    - name: release error
      if: failure() && steps.semantic.outputs.new-release-published == 'true' && steps.upload.outcome != 'success'
      shell: bash
      run: |
        {
          echo ":x: Github Release Failure"
          if [ -f "$LOG_FILE" ]; then
            echo '```'
            tail -n 80 "$LOG_FILE" | sed -E 's/\x1b\[[0-9;]*[A-Za-z]//g'
            echo '```'
          fi
        } >> "$GITHUB_STEP_SUMMARY"
      env:
        LOG_FILE: ${{ steps.build.outputs.log-file }}

    - name: find pr comment
      uses: peter-evans/find-comment@3eae4d37986fb5a8592848f6a574fdf654e61f9e # v3.1.0
      if: inputs.comment-enabled == 'true' && steps.upload.outcome == 'success'
      id: find-pr-comment
      with:
        issue-number: ${{ steps.semantic.outputs.pr-number }}
        body-includes: ${{ inputs.comment-header }} - ${{ inputs.name }}
        comment-author: "github-actions[bot]"

    - name: comment on release success
      id: release-pr-comment
      if: inputs.comment-enabled == 'true' && steps.upload.outcome == 'success'
      uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5.0.0
      with:
        comment-id: ${{ steps.find-pr-comment.outputs.comment-id }}
        issue-number: ${{ steps.semantic.outputs.pr-number }}
        edit-mode: replace
        body: |
          #### ${{ inputs.comment-header }} - ${{ inputs.name }} - :label: Commit: ${{ github.sha }} - :gear: Workflow: [${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          ```
          ${{ steps.semantic.outputs.git-tag }}
          ```

    - name: add released label
      if: steps.upload.outcome == 'success'
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      with:
        script: |
          var inputs = ${{ toJSON(inputs) }};
          var asset = inputs['name'];
          var released = `released: ${asset}`;
          var skipped = `skipped: ${asset}`;

          try {
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.semantic.outputs.pr-number }},
              labels: [released]
            });
          } catch (error) {
            console.log(error);
          }

          try {
            await github.rest.issues.removeLabel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.semantic.outputs.pr-number }},
              name: skipped
            });
          } catch (error) {
            console.log(error);
          }

    - name: error
      if: failure()
      shell: bash
      run: |
        echo "${SUMMARY}" >> "$GITHUB_STEP_SUMMARY"
      env:
        SUMMARY: |
          ---
          :x: An error occurred during execution! Check the workflow run logs for details!
