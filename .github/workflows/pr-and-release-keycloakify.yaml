on:
  workflow_call:
    inputs:

      job-name:
        description: "Name of the release asset."
        required: true
        type: string

      working-directory:
        description: "Directory containing the Keycloakify package.json."
        default: "."
        type: string

      node-version:
        description: "Node version used to build the theme."
        default: "24"
        type: string

      java-version:
        description: "Java version used by the Keycloakify jar build."
        default: "21"
        type: string

      test-script:
        description: "Name of an npm script to run before the build. Empty skips it."
        default: ""
        type: string

      build-command:
        description: "Command that builds the theme jar."
        default: "npm run build-keycloak-theme"
        type: string

      jar-glob:
        description: "Glob, relative to the working directory, matching the built jar."
        default: "dist_keycloak/**/*.jar"
        type: string

      base-image:
        description: "Base image the jar is copied into."
        default: "busybox:1.37"
        type: string

      registry:
        description: "URL of the container registry."
        required: true
        type: string

      registry-user:
        description: "Username for the container registry."
        required: true
        type: string

      registry-repo:
        description: "Repo within container registry project."
        required: true
        type: string

      registry-extra-tag-command:
        description: "Extra tag to push release container."
        default: ''
        type: string

      notation-cert:
        description: "Public key for notation signing images."
        required: true
        type: string

      platforms:
        description: "Comma-separated list of platforms to build for (e.g., linux/amd64,linux/arm64)"
        default: "linux/amd64"
        type: string

      comment-pr:
        description: "PR build comment creation and update."
        default: "true"
        type: string

      comment-release:
        description: "Release comment creation and update."
        default: "true"
        type: string

      release-tag-format:
        description: "Semantic-release Github release tag format."
        default: '${version}'
        type: string

    secrets:

      registry-token:
        description: "Authentication token for the container registry."
        required: true

      notation-key:
        description: "Private key for notation signing images."
        required: false

    outputs:
      release-info:
        description: "All release info in one json blob."
        value: ${{ jobs.keycloakify.outputs.release-info }}

      new-release-published:
        description: "Semantic release output."
        value: ${{ jobs.keycloakify.outputs.new-release-published }}

      release-version:
        description: "Semantic release output."
        value: ${{ jobs.keycloakify.outputs.release-version }}

      git-tag:
        description: "Semantic release output."
        value: ${{ jobs.keycloakify.outputs.git-tag }}

      pr-number:
        description: "Release PR number."
        value: ${{ jobs.keycloakify.outputs.pr-number }}

jobs:
  keycloakify:
    runs-on:
      labels: [ self-hosted, linux, x64 ]
      group: heavy
    outputs:
      release-info: ${{ steps.release.outputs.release-info }}
      new-release-published: ${{ steps.release.outputs.new-release-published }}
      release-version: ${{ steps.release.outputs.release-version }}
      git-tag: ${{ steps.release.outputs.git-tag }}
      pr-number: ${{ steps.release.outputs.pr-number }}
    steps:
      - id: release
        uses: SwanseaUniversityMedical/workflows/.github/actions/pr-and-release-keycloakify@test/keycloakify
        with:
          name: ${{ inputs.job-name }}
          working-directory: ${{ inputs.working-directory }}
          node-version: ${{ inputs.node-version }}
          java-version: ${{ inputs.java-version }}
          test-script: ${{ inputs.test-script }}
          build-command: ${{ inputs.build-command }}
          jar-glob: ${{ inputs.jar-glob }}
          base-image: ${{ inputs.base-image }}
          registry: ${{ inputs.registry }}
          registry-user: ${{ inputs.registry-user }}
          registry-repo: ${{ inputs.registry-repo }}
          registry-token: ${{ secrets.registry-token }}
          registry-extra-tag-command: ${{ inputs.registry-extra-tag-command }}
          platforms: ${{ inputs.platforms }}
          notation-cert: ${{ inputs.notation-cert }}
          notation-key: ${{ secrets.notation-key }}
          comment-pr: ${{ inputs.comment-pr }}
          comment-release: ${{ inputs.comment-release }}
          release-tag-format: ${{ inputs.release-tag-format }}
