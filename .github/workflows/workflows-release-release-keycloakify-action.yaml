name: Release Keycloakify Action

on:
  pull_request:
    types:
      - opened
      - synchronize
    paths:
      - '.github/workflows/workflows-release-release-keycloakify-action.yaml'
      - '.github/actions/release-keycloakify/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/workflows-release-release-keycloakify-action.yaml'
      - '.github/actions/release-keycloakify/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-keycloakify-action:
    uses: SwanseaUniversityMedical/workflows/.github/workflows/pr-and-release-repo.yaml@v2.1.2-repo
    with:
      job-name: release-keycloakify-action
      comment-release: true
      release-tag-format: 'v${version}-release-keycloakify-action'
